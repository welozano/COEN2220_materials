<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" role="img" aria-labelledby="title desc">
<title id="title">Estructura simple de una singly linked list</title><desc id="desc">Head apunta al primer nodo. Cada nodo tiene datos y un campo next. Las flechas comienzan en next.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1a4d7a"/></marker><style>.t{font:700 19px Arial;fill:#172b4d}.l{font:700 15px Arial;fill:#172b4d}.d{font:14px Arial;fill:#172b4d}.n{font:13px Arial;fill:#42526e}.b{fill:#f8fbff;stroke:#1a4d7a;stroke-width:2}.p{fill:#dceeff;stroke:#1a4d7a;stroke-width:2}.ar{fill:none;stroke:#1a4d7a;stroke-width:2.5;marker-end:url(#a)}</style></defs>
<text x="35" y="30" class="t">Una singly linked list: datos | next</text><text x="36" y="108" class="l">head</text><path d="M88 102H145" class="ar"/>
<g transform="translate(150 70)"><rect width="165" height="64" class="b"/><rect x="115" width="50" height="64" class="p"/><text x="12" y="27" class="d">turn: 101</text><text x="12" y="48" class="d">priority: yes</text><text x="121" y="37" class="l">next</text></g><path d="M315 102H375" class="ar"/>
<g transform="translate(380 70)"><rect width="165" height="64" class="b"/><rect x="115" width="50" height="64" class="p"/><text x="12" y="27" class="d">turn: 104</text><text x="12" y="48" class="d">priority: no</text><text x="121" y="37" class="l">next</text></g><path d="M545 102H605" class="ar"/>
<g transform="translate(610 70)"><rect width="165" height="64" class="b"/><rect x="115" width="50" height="64" class="p"/><text x="12" y="27" class="d">turn: 110</text><text x="12" y="48" class="d">priority: no</text><text x="121" y="37" class="l">next</text></g><path d="M775 102H825" class="ar"/><text x="838" y="84" class="n">no next node</text><text x="838" y="128" class="l">nullptr</text>
<text x="150" y="180" class="n">Cada flecha representa la dirección almacenada en el campo next.</text>
</svg>

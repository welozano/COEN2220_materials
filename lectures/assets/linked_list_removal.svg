<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Eliminación de un nodo</title><desc id="desc">El next de 108 se cambia para apuntar a 118. El nodo 112 queda desconectado y se libera. Las flechas salen de next.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1a4d7a"/></marker><style>.t{font:700 19px Arial;fill:#172b4d}.s{font:700 16px Arial;fill:#172b4d}.d{font:14px Arial;fill:#172b4d}.x{font:700 13px Arial;fill:#172b4d}.n{font:13px Arial;fill:#42526e}.b{fill:#f8fbff;stroke:#1a4d7a;stroke-width:2}.p{fill:#dceeff;stroke:#1a4d7a;stroke-width:2}.r{fill:#fde6e6;stroke:#ab3030;stroke-width:2.5}.ar{fill:none;stroke:#1a4d7a;stroke-width:2.5;marker-end:url(#a)}</style></defs>
<text x="30" y="30" class="t">Eliminar el turno 112</text><text x="30" y="65" class="s">Antes: previousNode es 108 y currentNode es 112.</text>
<g transform="translate(80 90)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">108</text><text x="12" y="45" class="n">previousNode</text><text x="89" y="34" class="x">next</text></g><path d="M205 119H290" class="ar"/><g transform="translate(295 90)"><rect width="125" height="58" class="r"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">112</text><text x="12" y="45" class="n">currentNode</text><text x="89" y="34" class="x">next</text></g><path d="M420 119H505" class="ar"/><g transform="translate(510 90)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="34" class="d">118</text><text x="89" y="34" class="x">next</text></g>
<text x="30" y="200" class="s">Después: previousNode.next apunta directamente a 118. Entonces se ejecuta delete currentNode.</text>
<g transform="translate(80 225)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">108</text><text x="12" y="45" class="n">previousNode</text><text x="89" y="34" class="x">next</text></g><path d="M205 254H505" class="ar"/><g transform="translate(510 225)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="34" class="d">118</text><text x="89" y="34" class="x">next</text></g><g transform="translate(700 235)"><rect width="130" height="40" class="r"/><text x="18" y="25" class="n">112 deleted</text></g>
</svg>

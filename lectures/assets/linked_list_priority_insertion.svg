<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Inserción de un turno prioritario</title><desc id="desc">El nuevo turno 125 queda entre el último turno prioritario 108 y el primer turno regular 112. Las flechas salen de next.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1a4d7a"/></marker><style>.t{font:700 19px Arial;fill:#172b4d}.s{font:700 16px Arial;fill:#172b4d}.d{font:14px Arial;fill:#172b4d}.x{font:700 13px Arial;fill:#172b4d}.n{font:13px Arial;fill:#42526e}.b{fill:#f8fbff;stroke:#1a4d7a;stroke-width:2}.p{fill:#dceeff;stroke:#1a4d7a;stroke-width:2}.g{fill:#e1f6e8;stroke:#258548;stroke-width:2.5}.ar{fill:none;stroke:#1a4d7a;stroke-width:2.5;marker-end:url(#a)}</style></defs>
<text x="30" y="30" class="t">Inserción de un turno prioritario</text><text x="30" y="65" class="s">Antes: 108 es el último turno prioritario.</text>
<g transform="translate(80 90)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">108</text><text x="12" y="45" class="n">priority</text><text x="89" y="34" class="x">next</text></g><path d="M205 119H290" class="ar"/><g transform="translate(295 90)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">112</text><text x="12" y="45" class="n">regular</text><text x="89" y="34" class="x">next</text></g><path d="M420 119H500" class="ar"/><text x="510" y="124" class="d">...</text>
<text x="30" y="200" class="s">Después: primero, newNode.next recibe la dirección de 112; después, 108.next apunta a 125.</text>
<g transform="translate(80 225)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">108</text><text x="12" y="45" class="n">priority</text><text x="89" y="34" class="x">next</text></g><path d="M205 254H290" class="ar"/><g transform="translate(295 225)"><rect width="125" height="58" class="g"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">125</text><text x="12" y="45" class="n">priority</text><text x="89" y="34" class="x">next</text></g><path d="M420 254H505" class="ar"/><g transform="translate(510 225)"><rect width="125" height="58" class="b"/><rect x="85" width="40" height="58" class="p"/><text x="12" y="25" class="d">112</text><text x="12" y="45" class="n">regular</text><text x="89" y="34" class="x">next</text></g><path d="M635 254H715" class="ar"/><text x="725" y="259" class="d">...</text>
</svg>

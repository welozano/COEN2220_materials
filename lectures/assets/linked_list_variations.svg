<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Comparación de singly, doubly y circular linked lists</title><desc id="desc">Diagramas sencillos muestran los campos next y previous y las flechas que parten de ellos.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1a4d7a"/></marker><style>.t{font:700 19px Arial;fill:#172b4d}.s{font:700 16px Arial;fill:#172b4d}.d{font:14px Arial;fill:#172b4d}.x{font:700 12px Arial;fill:#172b4d}.n{font:13px Arial;fill:#42526e}.b{fill:#f8fbff;stroke:#1a4d7a;stroke-width:2}.p{fill:#dceeff;stroke:#1a4d7a;stroke-width:2}.ar{fill:none;stroke:#1a4d7a;stroke-width:2.3;marker-end:url(#a)}</style></defs>
<text x="30" y="28" class="t">Variaciones de linked lists</text>
<text x="30" y="65" class="s">Singly: cada nodo tiene data y next.</text>
<g transform="translate(70 82)"><rect width="120" height="52" class="b"/><rect x="80" width="40" height="52" class="p"/><text x="18" y="32" class="d">data</text><text x="84" y="31" class="x">next</text></g><path d="M190 108H250" class="ar"/><g transform="translate(255 82)"><rect width="120" height="52" class="b"/><rect x="80" width="40" height="52" class="p"/><text x="18" y="32" class="d">data</text><text x="84" y="31" class="x">next</text></g><path d="M375 108H435" class="ar"/><text x="445" y="113" class="d">nullptr</text>
<text x="30" y="195" class="s">Doubly: cada nodo tiene previous, data y next.</text>
<g transform="translate(70 212)"><rect width="150" height="52" class="b"/><rect width="45" height="52" class="p"/><rect x="105" width="45" height="52" class="p"/><text x="5" y="31" class="x">prev</text><text x="55" y="32" class="d">data</text><text x="110" y="31" class="x">next</text></g><path d="M220 238H280" class="ar"/><g transform="translate(285 212)"><rect width="150" height="52" class="b"/><rect width="45" height="52" class="p"/><rect x="105" width="45" height="52" class="p"/><text x="5" y="31" class="x">prev</text><text x="55" y="32" class="d">data</text><text x="110" y="31" class="x">next</text></g><path d="M285 252H220" class="ar"/><path d="M435 238H495" class="ar"/><text x="505" y="243" class="d">nullptr</text><text x="70" y="282" class="n">next moves right; previous moves left.</text>
<text x="30" y="345" class="s">Circular: el next del último nodo vuelve al primer nodo.</text>
<g transform="translate(70 362)"><rect width="120" height="52" class="b"/><rect x="80" width="40" height="52" class="p"/><text x="18" y="32" class="d">data</text><text x="84" y="31" class="x">next</text></g><path d="M190 388H250" class="ar"/><g transform="translate(255 362)"><rect width="120" height="52" class="b"/><rect x="80" width="40" height="52" class="p"/><text x="18" y="32" class="d">data</text><text x="84" y="31" class="x">next</text></g><path d="M375 388H435" class="ar"/><g transform="translate(440 362)"><rect width="120" height="52" class="b"/><rect x="80" width="40" height="52" class="p"/><text x="18" y="32" class="d">data</text><text x="84" y="31" class="x">next</text></g><path d="M560 388 C650 388 650 442 130 442 C70 442 70 420 70 414" class="ar"/>
</svg>

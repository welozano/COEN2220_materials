<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title description">
  <title id="title">Before and after removing root node 50 with two children</title>
  <desc id="description">Before removal, 50 has subtrees beginning at 30 and 70. After removal, 70 becomes root and 30 is attached as the left child of 60, the leftmost node in the former right subtree.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#425466"/></marker></defs>
  <rect width="980" height="470" fill="white"/>
  <text x="245" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#17324d">Before removing 50</text>
  <text x="735" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#17324d">After removing 50</text>
  <line x1="219" y1="105" x2="133" y2="166" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/><line x1="271" y1="105" x2="357" y2="166" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="357" y1="214" x2="327" y2="276" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/><line x1="383" y1="214" x2="428" y2="276" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/><line x1="327" y1="324" x2="353" y2="354" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="245" cy="80" r="31" fill="#ffe2df" stroke="#a33a30" stroke-width="3"/><text x="245" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">50</text><text x="245" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#a33a30">removed</text>
  <circle cx="110" cy="190" r="31" fill="#eaf2fb" stroke="#17324d" stroke-width="3"/><text x="110" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">30</text>
  <circle cx="380" cy="190" r="31" fill="#daf5e8" stroke="#2e7d5b" stroke-width="3"/><text x="380" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">70</text>
  <circle cx="310" cy="300" r="31" fill="#daf5e8" stroke="#2e7d5b" stroke-width="3"/><text x="310" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">60</text><circle cx="445" cy="300" r="31" fill="#eaf2fb" stroke="#17324d" stroke-width="3"/><text x="445" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">80</text><circle cx="375" cy="385" r="31" fill="#eaf2fb" stroke="#17324d" stroke-width="3"/><text x="375" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">65</text>
  <line x1="709" y1="105" x2="623" y2="166" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/><line x1="761" y1="105" x2="847" y2="166" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/><line x1="597" y1="214" x2="567" y2="276" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/><line x1="623" y1="214" x2="668" y2="276" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="735" cy="80" r="31" fill="#daf5e8" stroke="#2e7d5b" stroke-width="3"/><text x="735" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">70</text><text x="735" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2e7d5b">new root</text>
  <circle cx="600" cy="190" r="31" fill="#eaf2fb" stroke="#17324d" stroke-width="3"/><text x="600" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">60</text><circle cx="870" cy="190" r="31" fill="#eaf2fb" stroke="#17324d" stroke-width="3"/><text x="870" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">80</text>
  <circle cx="555" cy="300" r="31" fill="#daf5e8" stroke="#2e7d5b" stroke-width="3"/><text x="555" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">30</text><text x="555" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2e7d5b">attached here</text>
  <circle cx="690" cy="300" r="31" fill="#eaf2fb" stroke="#17324d" stroke-width="3"/><text x="690" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#17324d">65</text>
  <text x="735" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">The omitted descendants of 30 remain attached to 30.</text>
</svg>
